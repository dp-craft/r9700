# stack/serve/27b.conf — the 27B (Qwen3.8-27B) serving convention, ONE file (user decision 2026-10-25).
# Sourced by the 27B starters (stack/serve/{vllm,radiance}/start_*27b*.sh, start_qwen38_27b_*_rad.sh)
# and launchers (clients/claude/claude-{rad-mxfp4,rad-heretic,rad-iq4rlv4*,sly-redhat,sly-heretic}.sh)
# BEFORE their own ${VAR:-...} fallbacks. The env always wins: every line is ${VAR:-default}, so
# MAXLEN=... still overrides in the launchers and the radiance starter; the vLLM starters
# (start_redhat/heretic_27b.sh) take MAXLEN from their settings file instead (see below).
#
# Values: 260000 ctx + 2 seqs (the model's native window is 262144; 260000 = DC1 re-tune 2026-11-09 from
# 262000 — 262000 fit MEASURED, so the lower window is accepted without re-testing; MEASURED 2026-10-30:
# KV cache 370,702 tokens at 262000, GPU_UTIL 0.93); SPEC_K 7 = the
# DFlash2 drafter's own depth; HEADROOM_MIB 596 = the live headroom issue (the default 96 left 113 MiB
# free at peak and crashed the desktop once — docs/guides/vllm/known-issues.md).
# NOT for: Ornith 1.5 35B (262144/3, the creator's compose — start_ornith_35b_vllm_rad.sh keeps its own),
# the Quark 27B launcher (claude-sly-amd.sh, its own profile's 150000), or the engine
# drivers themselves (their defaults are the generic card fallbacks; other models keep their own windows).
# vLLM starters: the settings file's CLAUDE_CODE_MAX_CONTEXT_TOKENS is authoritative for MAXLEN (the server
# must cover Claude's window) — this conf's MAXLEN governs the radiance track and the claude-sly-* launchers;
# both are 260000 today.
MAXLEN=${MAXLEN:-260000}
MAXSEQS=${MAXSEQS:-2}
# SPEC_K reaches the redhat and heretic vLLM chains (start_redhat_27b.sh and start_heretic_27b.sh serve_env,
# claude-sly-redhat.sh and claude-sly-heretic.sh) and claude-rad-iq4rlv4-dflash.sh;
# the DFlash profiles' :-7 is only a fallback.
SPEC_K=${SPEC_K:-7}
HEADROOM_MIB=${HEADROOM_MIB:-596}
