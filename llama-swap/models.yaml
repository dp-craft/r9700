  # "kvq8" id; generate.py now maps kv -> --kv-cache-dtype and refuses q8_0 on vllm rows.
  # CAVEATS (MEASURED 2026-09-12 Phase A): on this hybrid fp8 left the KV pool token-for-token
  # identical to f16, so it does NOT buy window -- the mtp 0 below is what makes 200 000 fit (pool
