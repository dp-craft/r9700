[pytest]
# Bare `pytest` from the repo root runs the repo's own tests (validation item S0-1). Skipped: bench/workers/code/ worker
# fixtures (duplicate module names), bench/workloads/corpus/ (third-party prompt corpus), var/ and tmp/ (builds, raw).
testpaths = bench stack
norecursedirs = .* *.egg build dist venv node_modules var tmp corpus code
